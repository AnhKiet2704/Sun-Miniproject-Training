<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="card narrow">
    <h1>Đăng nhập</h1>
    <div class="alert error" th:if="${param.error}">Sai tên đăng nhập hoặc mật khẩu</div>
    <div class="alert success" th:if="${param.logout}">Bạn đã đăng xuất</div>
    <div class="alert success" th:if="${param.registered}">Đăng ký thành công, hãy đăng nhập</div>

    <form th:action="@{/login}" method="post">
        <label for="username">Tên đăng nhập</label>
        <input type="text" id="username" name="username" required autofocus>

        <label for="password">Mật khẩu</label>
        <input type="password" id="password" name="password" required>

        <div class="form-actions">
            <button type="submit">Đăng nhập</button>
        </div>
    </form>
    <p class="muted">Chưa có tài khoản? <a th:href="@{/register}">Đăng ký</a></p>
</div>
</body>
</html>
