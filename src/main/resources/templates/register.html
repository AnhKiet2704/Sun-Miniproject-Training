<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="card narrow">
    <h1>Đăng ký tài khoản</h1>

    <form th:action="@{/register}" th:object="${registerRequest}" method="post">
        <label for="username">Tên đăng nhập</label>
        <input type="text" id="username" th:field="*{username}">
        <div class="error-text" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>

        <label for="password">Mật khẩu</label>
        <input type="password" id="password" th:field="*{password}">
        <div class="error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

        <div class="form-actions">
            <button type="submit">Đăng ký</button>
            <a class="btn secondary" th:href="@{/login}">Quay lại</a>
        </div>
    </form>
</div>
</body>
</html>
