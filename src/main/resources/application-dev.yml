# Profile dev: MySQL local. Configure DB_URL, DB_USERNAME and DB_PASSWORD for this machine.
spring:
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/employee_db_dev?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.example.employeemanagement: DEBUG
